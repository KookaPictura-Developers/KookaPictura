[package]
name = "pictura-render"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
pictura-core = { path = "../pictura-core" }
# M4-B: decode adjustment-layer payloads into destructive Adjustment ops.
pictura-adjust = { path = "../pictura-adjust" }
# M12: document-wide resize/canvas/orientation wrappers.
pictura-ops = { path = "../pictura-ops" }
# M6-C: apply destructive filters to a layer's color channels.
pictura-filters = { path = "../pictura-filters" }
# Decode an embedded PSD/PSB smart-object source when a layer has no raster proxy.
pictura-codec = { path = "../pictura-codec" }
# wgpu/pollster versions track `pictura-app`, which already pulls wgpu 30.0.1.
wgpu = { version = "30.0.1", default-features = false, features = ["std", "vulkan", "wgsl"] }
pollster = "1"
# Pure-Rust TTF parser kept for bundled-text metrics (ascent/count/lookup).
fontdue = "0.9"
# Pure-Rust HarfBuzz port for line shaping (kerning + default GPOS/GSUB).
rustybuzz = "0.20"
# Pure-Rust glyph rasterizer honoring fractional subpixel offsets.
swash = { version = "0.2.10", features = ["scale", "render"] }

[dev-dependencies]
pictura-testkit = { path = "../pictura-testkit" }
