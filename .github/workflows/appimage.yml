name: appimage

# Builds the x86_64 AppImage for a release tag and attaches it to that release.
# release-please.yml calls this after it cuts a release (a release created with
# GITHUB_TOKEN cannot trigger a `release:` workflow). Run it by hand to rebuild
# or re-upload the asset for an existing tag. A PR touching the packaging runs
# the same build as a dry run and keeps the AppImage as a workflow artifact.
on:
  pull_request:
    paths:
      - .github/workflows/appimage.yml
      - packaging/**
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, e.g. v0.1.0
        type: string
        required: true

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag }}
      VERSION: ${{ inputs.tag || format('pr{0}', github.event.number) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Install pinned toolchain
        run: rustup show active-toolchain

      # libfuse2 lets the linuxdeploy AppImages run; the packaged AppImage itself
      # is smoke-checked with APPIMAGE_EXTRACT_AND_RUN instead.
      - name: Install lld, ninja, lcms2, Vulkan headers, and FUSE
        run: sudo apt-get update && sudo apt-get install -y lld ninja-build liblcms2-dev libvulkan-dev libfuse2t64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"

      # No --locked: the Release PR bumps Cargo.toml but not Cargo.lock (DEVELOPING.md).
      - name: Build and stage the AppDir
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --parallel
          DESTDIR="$PWD/AppDir" cmake --install build

      # libvulkan and the GPU drivers stay on the host: wgpu dlopens them.
      - name: Bundle Qt and dependencies
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
          EXTRA_PLATFORM_PLUGINS: libqoffscreen.so
          # linuxdeploy's bundled strip cannot read RELR sections (newer toolchains).
          NO_STRIP: "1"
        run: |
          base=https://github.com/linuxdeploy
          curl -fsSLO "$base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          curl -fsSLO "$base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy*.AppImage
          OUTPUT="KookaPictura-${VERSION#v}-x86_64.AppImage" \
            ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage

      - name: Smoke-check the packaged binary
        run: APPIMAGE_EXTRACT_AND_RUN=1 ./KookaPictura-*-x86_64.AppImage --headless --self-test

      - name: Keep the dry-run AppImage
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: KookaPictura-*-x86_64.AppImage
          retention-days: 7

      - name: Upload release assets
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" KookaPictura-*-x86_64.AppImage --clobber
