name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - &checkout
        uses: actions/checkout@v4

      # Reads rust-toolchain.toml (channel 1.98) and installs it on the runner.
      - &toolchain
        name: Install pinned toolchain
        run: rustup show active-toolchain

      - &apt
        name: Install lld and ninja
        run: sudo apt-get update && sudo apt-get install -y lld ninja-build

      - &qt
        name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          cache: true

      - &sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - &rustcache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - uses: taiki-e/install-action@nextest

      - name: Test
        run: cargo nextest run --workspace

      - name: Doctests
        run: cargo test --workspace --doc

      - name: Upload nextest JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit
          path: target/nextest/default/junit.xml

      - name: Install cargo-deny
        if: ${{ hashFiles('deny.toml') != '' }}
        run: cargo install cargo-deny --locked

      - name: Deny
        if: ${{ hashFiles('deny.toml') != '' }}
        run: cargo deny check

  qt-headless:
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - *toolchain
      - *apt
      - *qt
      - *sccache
      - *rustcache

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        run: cmake --build build --parallel

      - name: Self-test
        run: ./build/pictura --headless --self-test

      - name: Self-test with document
        run: ./build/pictura --headless --self-test crates/pictura-codec/tests/fixtures/two_layers.psd

      - name: Control e2e
        run: bash scripts/verify-control.sh

  oracles:
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - *toolchain
      - *apt
      - *qt
      - *sccache
      - *rustcache

      - name: Install ImageMagick 7
        run: |
          curl -fsSL -o /tmp/magick.AppImage \
            https://github.com/ImageMagick/ImageMagick/releases/download/7.1.2-31/ImageMagick-7.1.2-31-gcc-x86_64.AppImage
          chmod +x /tmp/magick.AppImage
          ( cd /tmp && /tmp/magick.AppImage --appimage-extract >/dev/null )
          sudo mv /tmp/squashfs-root /opt/imagemagick
          sudo tee /usr/local/bin/magick >/dev/null <<'EOF'
          #!/usr/bin/env bash
          exec /opt/imagemagick/AppRun "$@"
          EOF
          sudo chmod +x /usr/local/bin/magick
          magick -version

      - name: Install psd-tools
        run: python3 -m pip install --user --break-system-packages "psd-tools>=1.19"

      - name: Install ag-psd
        run: npm i ag-psd

      - name: Test
        run: cargo test --workspace
