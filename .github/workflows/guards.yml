name: guards

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Developer Certificate of Origin sign-off
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"; head="$PR_HEAD"
          else
            base="$PUSH_BEFORE"; head="$PUSH_AFTER"
          fi
          missing=''
          for sha in $(git rev-list --no-merges "$base..$head" 2>/dev/null || true); do
            git log -1 --format='%B' "$sha" | grep -qi '^Signed-off-by: ' || missing="$missing $sha"
          done
          if [ -n "$missing" ]; then
            echo "::error::Commits missing a DCO 'Signed-off-by:' line:$missing"
            exit 1
          fi

  guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install OpenSpec
        run: npm i -g @fission-ai/openspec@1.3.1
      - name: Non-goal guard
        env:
          GUARD_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/guard.sh
      - name: File size
        run: bash scripts/check-file-size.sh
      - name: OpenSpec validation
        run: openspec validate --all --strict
